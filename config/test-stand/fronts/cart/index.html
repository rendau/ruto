<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>cart front (oidc-client-ts through the ruto broker)</title>
  <style>
    body { font: 14px system-ui, sans-serif; margin: 2rem; }
    button { margin-right: .5rem; }
    pre { background: #f4f4f4; padding: 1rem; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>
  <h1>cart — oidc-client-ts</h1>
  <p>The library auth-js is built on, with what auth-js is to get: cookies sent to the broker and,
     on opening a page without tokens, userinfo asked first (the broker answers it with tokens at a
     live session, so there is no redirect). Client <code>cart-fe</code>.</p>
  <button id="login">Login</button>
  <button id="refresh">Refresh</button>
  <button id="userinfo">Userinfo</button>
  <button id="logout">Logout</button>
  <button id="forget">Forget user</button>
  <pre id="out">…</pre>
  <script src="../node_modules/oidc-client-ts/dist/browser/oidc-client-ts.min.js"></script>
  <script>
    (async () => {
      const gateway = 'http://localhost:8088';
      const authority = `${gateway}/_auth/corp/cart-fe/realms/corp`;
      const out = document.getElementById('out');
      const show = (value) => { out.textContent = JSON.stringify(value, null, 2); };

      const manager = new oidc.UserManager({
        authority,
        client_id: 'cart-fe',
        redirect_uri: `${location.origin}/cart/`,
        post_logout_redirect_uri: `${location.origin}/cart/`,
        response_type: 'code',
        scope: 'openid profile email',
        fetchRequestCredentials: 'include', // the broker finds the session by the gateway's cookies
        loadUserInfo: true,
        automaticSilentRenew: false, // the keep-alive loop below renews, so that it can count
        userStore: new oidc.WebStorageStateStore({ store: window.sessionStorage }),
      });
      window.__oidc = manager;
      // openedBy: how the page got its user — callback (after a login), storage, userinfo (no redirect), none
      window.__state = { error: null, user: null, openedBy: 'none', userinfo: null,
        calls: { ok: 0, unauthorized: 0, other: 0, refreshed: 0, refreshFailed: 0 } };

      const summary = (user) => user ? {
        openedBy: window.__state.openedBy,
        user: user.profile.preferred_username,
        sub: user.profile.sub,
        roles: user.profile.resource_access && user.profile.resource_access['cart-fe'],
        expiresIn: user.expires_in,
        calls: window.__state.calls,
      } : { user: null, openedBy: window.__state.openedBy, error: window.__state.error };

      // What auth-js is to do on init: no tokens in memory and not a login callback — ask userinfo
      // without a token, with the cookies; tokens in the answer make the user, 401 means a usual login.
      const openByUserinfo = async () => {
        const meta = await manager.metadataService.getMetadata();
        const rep = await fetch(meta.userinfo_endpoint, { credentials: 'include' });
        if (rep.status !== 200) return null;
        const body = await rep.json();
        if (!body.tokens) return null;
        const { tokens, ...profile } = body;
        const user = new oidc.User({
          access_token: tokens.access_token,
          refresh_token: tokens.refresh_token,
          token_type: tokens.token_type,
          scope: tokens.scope || 'openid profile email',
          profile,
          expires_at: Math.floor(Date.now() / 1000) + tokens.expires_in,
        });
        await manager.storeUser(user);
        return user;
      };

      try {
        const params = new URLSearchParams(location.search);
        if (params.has('code') || params.has('error')) {
          window.__state.user = await manager.signinRedirectCallback();
          window.__state.openedBy = 'callback';
          history.replaceState(null, '', location.pathname);
        } else {
          window.__state.user = await manager.getUser();
          if (window.__state.user) {
            window.__state.openedBy = 'storage';
          } else {
            window.__state.user = await openByUserinfo();
            if (window.__state.user) window.__state.openedBy = 'userinfo';
          }
        }
      } catch (e) {
        window.__state.error = String(e && e.message || e);
      }
      window.__state.summary = () => summary(window.__state.user);
      show(summary(window.__state.user));

      // inside the shell (fronts/shell): the shell asks how the page is doing, cross-origin
      window.addEventListener('message', (e) => {
        if (e.data !== 'ruto-state?') return;
        e.source.postMessage({ front: 'cart', summary: summary(window.__state.user), calls: window.__state.calls,
          userinfo: window.__state.userinfo && window.__state.userinfo.status }, e.origin);
      });

      const refresh = async () => {
        try {
          window.__state.user = await manager.signinSilent(); // the refresh_token grant
          window.__state.calls.refreshed++;
          return true;
        } catch (e) {
          window.__state.calls.refreshFailed++;
          window.__state.error = String(e && e.message || e);
          return false;
        }
      };
      const askUserinfo = async () => {
        const user = window.__state.user;
        const meta = await manager.metadataService.getMetadata();
        const rep = await fetch(meta.userinfo_endpoint, {
          credentials: 'include',
          headers: user ? { Authorization: `Bearer ${user.access_token}` } : {},
        });
        const body = rep.headers.get('content-type')?.includes('json') ? await rep.json() : await rep.text();
        window.__state.userinfo = { status: rep.status, body };
        return rep.status;
      };

      // keep-alive: renew a minute before expiry, then a work request (userinfo with the token)
      const tick = async () => {
        const user = window.__state.user;
        if (!user) return;
        if (user.expires_in < 60 && !(await refresh())) return;
        const status = await askUserinfo();
        const calls = window.__state.calls;
        if (status === 200) calls.ok++; else if (status === 401) calls.unauthorized++; else calls.other++;
      };
      setInterval(tick, 20000);
      window.__state.tick = tick;
      window.__state.refresh = refresh;

      document.getElementById('login').onclick = () => manager.signinRedirect();
      document.getElementById('refresh').onclick = async () => { await refresh(); show(summary(window.__state.user)); };
      document.getElementById('userinfo').onclick = async () => { await askUserinfo(); show(window.__state.userinfo); };
      document.getElementById('logout').onclick = () => manager.signoutRedirect();
      document.getElementById('forget').onclick = async () => {
        await manager.removeUser();
        window.__state.user = null;
        show(summary(null));
      };
    })();
  </script>
</body>
</html>
