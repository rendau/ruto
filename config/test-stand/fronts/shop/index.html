<!doctype html>
<html><head><meta charset="utf-8"><title>Shop front (shared login)</title>
<style>body{font:14px/1.4 -apple-system,sans-serif;margin:24px;max-width:900px}button{margin:4px 6px 4px 0;padding:6px 12px}
pre{background:#f4f4f4;padding:8px;white-space:pre-wrap;word-break:break-all}#user{font-weight:600}#log{max-height:320px;overflow:auto}</style></head>
<body>
<h2>Shop front (shared login)</h2>
<p>Me: <code>/_auth/corp/me</code> · Unit: <code>/_auth/corp</code> · API: <code>/shop/hello</code> · SDK: <code>@rendau/ruto-auth</code> (browser bundle)</p>
<p>Status: <span id="user">…</span></p>
<p>
<button id="login">Login</button>
<button id="me">Me</button>
<button id="call">Call API</button>
<button id="refresh">Refresh</button>
<button id="logout">Logout</button>
</p>
<pre id="claims"></pre>
<pre id="log"></pre>
<!-- symlink to sdk/js/dist/ruto-auth.iife.js: run `make build-sdk` first -->
<script src="/ruto-auth.iife.js"></script>
<script>
const GW = 'http://localhost:8088';
const API = GW + '/shop/hello';
const log = (...a) => { const el = document.getElementById('log'); el.textContent = new Date().toISOString().slice(11,19) + ' ' + a.join(' ') + '\n' + el.textContent; };

// Shared login of the provider: no `app`. Session over → straight to the login.
const auth = RutoAuth.createRutoAuth({
  gateway: GW,
  provider: 'corp',
  onLoginRequired: () => { log('login required'); window.__loginRequired = (window.__loginRequired || 0) + 1; },
});

async function me() {
  let claims;
  try { claims = await auth.me(); } catch (e) { log('me failed:', e.message); return 0; }
  window.__me = claims;
  if (claims) {
    log('me -> 200');
    document.getElementById('user').textContent = 'logged in as ' + RutoAuth.usernameOf(claims) + ' (exp ' + new Date(claims.exp * 1000).toLocaleTimeString() + ', roles ' + JSON.stringify(RutoAuth.rolesOf(claims)) + ')';
    document.getElementById('claims').textContent = JSON.stringify(claims, null, 2);
    return 200;
  }
  log('me -> 401');
  document.getElementById('user').textContent = 'not logged in';
  document.getElementById('claims').textContent = '';
  return 401;
}

async function call() {
  const r = await auth.fetch(API);
  const t = await r.text();
  log('api ->', r.status, t);
  window.__api = { status: r.status, body: t };
  return r.status;
}

const refresh = async () => { const st = await auth.refresh(); log('refresh ->', st); return st; };
document.getElementById('login').onclick = () => auth.login();
document.getElementById('logout').onclick = () => auth.logout(location.origin + '/');
document.getElementById('me').onclick = me;
document.getElementById('call').onclick = call;
document.getElementById('refresh').onclick = refresh;
window.__ruto = { me, call, refresh, login: () => auth.login(), logout: () => auth.logout(location.origin + '/'), auth };
me();
</script>
</body></html>
