<!doctype html>
<html><head><meta charset="utf-8"><title>Shop front (shared login, no SDK)</title>
<style>body{font:14px/1.4 -apple-system,sans-serif;margin:24px;max-width:900px}button{margin:4px 6px 4px 0;padding:6px 12px}
pre{background:#f4f4f4;padding:8px;white-space:pre-wrap;word-break:break-all}#user{font-weight:600}#log{max-height:320px;overflow:auto}</style></head>
<body>
<h2>Shop front (shared login, no SDK)</h2>
<p>Unit: <code>/_auth/corp/login|refresh|logout</code> · API: <code>/shop/hello</code> (the backend gets the shared token) · plain <code>fetch</code>, cookies only</p>
<p>Status: <span id="user">…</span></p>
<p>
<button id="login">Login</button>
<button id="call">Call API</button>
<button id="refresh">Refresh</button>
<button id="logout">Logout</button>
</p>
<pre id="claims"></pre>
<pre id="log"></pre>
<script>
const GW = 'http://localhost:8088';
const UNIT = GW + '/_auth/corp';
const API = GW + '/shop/hello';
const log = (...a) => { const el = document.getElementById('log'); el.textContent = new Date().toISOString().slice(11,19) + ' ' + a.join(' ') + '\n' + el.textContent; };

// A page without an SDK: the gateway keeps the tokens in its cookies; the page
// goes to login, renews the cookies with POST refresh after a 401 and repeats
// the request once. A 401 from refresh means the session is over.
let refreshing = null;
async function refresh() {
  refreshing = refreshing || fetch(UNIT + '/refresh', { method: 'POST', credentials: 'include' })
    .then(r => r.status).finally(() => { refreshing = null; });
  const st = await refreshing;
  log('refresh ->', st);
  return st;
}

async function gwFetch(url) {
  let r = await fetch(url, { credentials: 'include' });
  if (r.status !== 401) return r;
  if (await refresh() !== 204) {
    window.__loginRequired = (window.__loginRequired || 0) + 1;
    log('login required');
    return r;
  }
  return fetch(url, { credentials: 'include' });
}

// The backend stub answers with the claims of the token it got (`token`): the
// page learns who is logged in from there.
async function call() {
  const r = await gwFetch(API);
  const t = await r.text();
  log('api ->', r.status, t);
  let body = null;
  try { body = JSON.parse(t); } catch (e) {}
  const token = body && body.token;
  window.__api = { status: r.status, body: t, token };
  const user = document.getElementById('user');
  if (r.status === 200 && token) {
    user.textContent = 'logged in as ' + (token.preferred_username || token.sub) + ' (exp ' + new Date(token.exp * 1000).toLocaleTimeString() + ')';
    document.getElementById('claims').textContent = JSON.stringify(token, null, 2);
  } else {
    user.textContent = r.status === 401 ? 'not logged in' : 'api answered ' + r.status;
    document.getElementById('claims').textContent = '';
  }
  return r.status;
}

const back = () => location.origin + location.pathname;
const login = () => { location.href = UNIT + '/login?redirect=' + encodeURIComponent(back()); };
const logout = () => { location.href = UNIT + '/logout?redirect=' + encodeURIComponent(back()); };
document.getElementById('login').onclick = login;
document.getElementById('logout').onclick = logout;
document.getElementById('call').onclick = call;
document.getElementById('refresh').onclick = refresh;
window.__ruto = { call, refresh, login, logout };

const failed = new URLSearchParams(location.search).get('auth_error');
if (failed) log('login failed:', failed);
call();
</script>
</body></html>
