syntax = "proto3";

package ruto_v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";

option go_package = "/ruto_v1";

service Snapshot {
  rpc GetVersion(google.protobuf.Empty) returns (SnapshotVersion) {
    option (google.api.http) = { get: "/snapshot/version" };
  };
  // Get returns the full config with secrets in plain text. It is meant for
  // gateways only, so it is gRPC-only (no REST mapping) and must stay off the
  // public HTTP API.
  rpc Get(google.protobuf.Empty) returns (SnapshotResponse);
  rpc Deploy(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (google.api.http) = { post: "/snapshot/deploy" };
  };
}

message SnapshotResponse {
  google.protobuf.Struct data = 1;
}

message SnapshotVersion {
  string version = 1;
}
