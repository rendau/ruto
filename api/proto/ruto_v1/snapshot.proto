syntax = "proto3";

package ruto_v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";

option go_package = "/ruto_v1";

service Snapshot {
  rpc GetVersion(google.protobuf.Empty) returns (SnapshotVersion) {
    option (google.api.http) = { get: "/snapshot/version" };
  };
  // Get returns the full config with secrets in plain text. It is meant for
  // gateways only, so it is gRPC-only (no REST mapping) and must stay off the
  // public HTTP API.
  rpc Get(google.protobuf.Empty) returns (SnapshotResponse);
  rpc Deploy(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (google.api.http) = { post: "/snapshot/deploy" };
  };
}

message SnapshotResponse {
  google.protobuf.Struct data = 1;
  // Runtime settings of the gateways, from core's environment: not part of
  // the published config and not stored.
  GatewaySettings gateway = 2;
}

message SnapshotVersion {
  string version = 1;
  // Changes when the gateway settings change; a keyed hash, so it tells
  // nothing about them. Empty when there are none.
  string settings_version = 2;
}

message GatewaySettings {
  // Redis the gateways share login session refreshes through; empty addr —
  // none, each gateway refreshes on its own.
  string redis_addr = 1;
  string redis_password = 2;
  int32 redis_db = 3;
  // Key the gateways seal the refresh cookie of a login session with (AES-256,
  // 32 bytes), the same on every pod. Empty: no refresh cookie is issued.
  bytes cookie_key = 4;
}
