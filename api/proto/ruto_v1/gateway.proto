syntax = "proto3";

package ruto_v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

option go_package = "/ruto_v1";

service Gateway {
  rpc Heartbeat(GatewayHeartbeatRequest) returns (google.protobuf.Empty);
  rpc List(google.protobuf.Empty) returns (GatewayListResponse) {
    option (google.api.http) = { get: "/gateway" };
  };
  // Subscribe opens a long-lived server stream. The gateway keeps it open and
  // core pushes notifications (e.g. "check snapshot version now") through it,
  // making config propagation instant instead of poll-driven.
  rpc Subscribe(GatewaySubscribeRequest) returns (stream GatewayNotification);
}

message GatewaySubscribeRequest {
  string gateway_id = 1;
}

message GatewayNotification {
  // type of notification: "check_version" (snapshot) or "check_blocklist"
  // (BlockedClient.GetVersion).
  string type = 1;
}

message GatewayHeartbeatRequest {
  string gateway_id = 1;
  reserved 3;
  string host_name = 5;
  string snapshot_version = 6;
  int64 last_apply_at_unix = 7;
  int64 started_at_unix = 8;
  string last_error = 9;
  uint64 memory_alloc_bytes = 10;
  uint32 goroutines_count = 11;
  // requests served by wildcard endpoints since the previous heartbeat
  repeated GatewaySeenPath seen_paths = 12;
  // Origin headers of requests since the previous heartbeat
  repeated GatewaySeenOrigin seen_origins = 13;
  // BlockedClient version the gateway applies
  string blocklist_version = 14;
  // per-client request counters since the previous heartbeat (bounded: the
  // busiest clients and those refused; the rest summed in a row with ip "")
  repeated GatewayClientStat client_stats = 15;
}

// GatewayClientStat counts the requests of one client since the previous
// heartbeat. ip is the client address (an IPv6 client as its /64, e.g.
// "2001:db8:1:2::/64"); for a trusted client it is the trusted network
// ("10.0.0.0/8") and trusted is its name. ip "" sums clients that did not fit
// the report or whose address could not be told.
message GatewayClientStat {
  string ip = 1;
  string trusted = 2;
  int64 requests = 3;
  // refused by the block list (403 / PermissionDenied)
  int64 blocked = 4;
  // rejected by a rate-limit rule (429 / ResourceExhausted)
  int64 limited = 5;
  // label of the rule of the latest rejection ("" when none)
  string last_rule = 6;
  // CORS preflights among requests that the gateway answered itself: they
  // reach no endpoint, so no rate limit counts them
  int64 preflights = 7;
}

message GatewaySeenOrigin {
  string origin = 1;
  int64 hits = 2;
  int64 last_seen_at_unix = 3;
}

message GatewaySeenPath {
  string app_id = 1;
  string endpoint_id = 2;
  string method = 3;
  string path = 4;
  int64 hits = 5;
  int64 hits_not_found = 6;
  int64 last_seen_at_unix = 7;
  string sample = 8;
}

message GatewayListResponse {
  repeated GatewayStateItem results = 1;
}

message GatewayStateItem {
  string gateway_id = 1;
  reserved 3;
  string host_name = 5;
  string snapshot_version = 6;
  int64 last_apply_at_unix = 7;
  int64 started_at_unix = 8;
  string last_error = 9;
  int64 last_seen_at_unix = 10;
  string status = 11;
  uint64 memory_alloc_bytes = 12;
  uint32 goroutines_count = 13;
  string blocklist_version = 14;
}
