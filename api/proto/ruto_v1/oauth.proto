syntax = "proto3";

package ruto_v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

option go_package = "/ruto_v1";

// OAuth backs the consent page of the built-in MCP server's OAuth flow and
// the list of connected clients. Admins only, from an admin login.
service OAuth {
  // DescribeAuthorization checks an authorization request and describes the
  // client for the consent page.
  rpc DescribeAuthorization(OAuthAuthorizeReq) returns (OAuthAuthorizeInfoRep) {
    option (google.api.http) = { post: "/oauth/authorize/describe" body: "*" };
  };
  // Authorize records the decision and returns where to send the browser.
  rpc Authorize(OAuthAuthorizeReq) returns (OAuthAuthorizeRep) {
    option (google.api.http) = { post: "/oauth/authorize" body: "*" };
  };
  rpc ListGrants(google.protobuf.Empty) returns (OAuthGrantListRep) {
    option (google.api.http) = { get: "/oauth/grant" };
  };
  rpc DeleteGrant(OAuthGrantDeleteReq) returns (google.protobuf.Empty) {
    option (google.api.http) = { delete: "/oauth/grant/{id}" };
  };
}

// OAuthAuthorizeReq carries the query of the authorization request as is.
message OAuthAuthorizeReq {
  string response_type = 1;
  string client_id = 2;
  string redirect_uri = 3;
  string state = 4;
  string code_challenge = 5;
  string code_challenge_method = 6;
  string scope = 7;
  string resource = 8;
  bool approve = 9; // Authorize only
}

message OAuthAuthorizeInfoRep {
  string client_name = 1;
  string redirect_uri = 2;
  string redirect_host = 3;
}

message OAuthAuthorizeRep {
  string redirect_url = 1;
}

message OAuthGrantMain {
  string id = 1;
  string client_name = 2;
  string redirect_host = 3;
  int64 created_at_unix = 4;
  int64 connected_at_unix = 5;
  int64 last_used_at_unix = 6; // 0 = never used
}

message OAuthGrantListRep {
  repeated OAuthGrantMain results = 1;
}

message OAuthGrantDeleteReq {
  string id = 1;
}
